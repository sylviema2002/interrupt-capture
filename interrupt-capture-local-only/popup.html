<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中断快记</title>
  <style>
    :root {
      --bg: #f6f8ff;
      --panel: #fff;
      --text: #1f2329;
      --muted: #646a73;
      --line: #dee0e3;
      --primary: #1f5fd7;
      --primary-dark: #194fb4;
      --primary-soft: #f0f4ff;
      --purple: #7b4dff;
      --purple-soft: #f8f5ff;
      --danger: #d83931;
      --done: #18a058;
      --paused: #7b61ff;
    }

    * { box-sizing: border-box; }

    body {
      width: 360px;
      margin: 0;
      padding: 12px;
      background:
        radial-gradient(circle at top right, rgba(123, 97, 255, 0.10), transparent 32%),
        linear-gradient(180deg, #f4f7ff 0%, var(--bg) 45%, #fbfcff 100%);
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--text);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .topbar h1 { margin: 0; }

    .icon-btn {
      min-height: 32px;
      width: 34px;
      padding: 0;
      border-radius: 8px;
      background: var(--primary-soft);
      color: var(--primary-dark);
      font-size: 17px;
      line-height: 1;
    }

    .icon-btn:hover { background: #e7edff; }

    .settings {
      display: none;
      margin: 0 0 8px;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 4px 14px rgba(31, 35, 41, 0.05);
    }

    .settings.open { display: block; }

    .settings-row {
      display: grid;
      grid-template-columns: 1fr 76px auto;
      gap: 8px;
      align-items: center;
    }

    .settings-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .settings-actions.single {
      grid-template-columns: 1fr;
    }

    .settings label {
      color: var(--muted);
      font-size: 12px;
    }

    input[type="number"],
    select {
      width: 100%;
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 8px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 88px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      resize: vertical;
      line-height: 1.5;
      font: inherit;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    textarea:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: rgba(51, 112, 255, 0.65);
      box-shadow: 0 0 0 2px rgba(51, 112, 255, 0.10);
    }

    button {
      border: 0;
      border-radius: 8px;
      min-height: 36px;
      padding: 8px 10px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
      font: inherit;
    }

    button:hover { background: var(--primary-dark); }

    button.secondary {
      background: var(--primary-soft);
      color: var(--text);
    }

    button.secondary:hover { background: #e7edff; }

    button.danger {
      background: #fff1f0;
      color: var(--danger);
    }

    button.listening {
      background: var(--purple);
      color: #fff;
    }

    .source,
    .meta,
    .empty {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .source {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-bottom: 8px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }

    .primary {
      grid-column: 1 / -1;
      min-height: 42px;
      font-weight: 700;
    }

    .list {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      max-height: 320px;
      overflow: auto;
    }

    .item {
      border: 1px solid var(--line);
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      background: var(--panel);
      padding: 9px;
      display: grid;
      gap: 7px;
      box-shadow: 0 3px 10px rgba(31, 35, 41, 0.04);
    }

    .item.done {
      opacity: 0.68;
      border-left-color: var(--done);
    }

    .item.paused {
      opacity: 0.78;
      border-left-color: var(--paused);
      background: var(--purple-soft);
    }

    .text {
      margin: 0;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text);
      font-weight: 600;
    }

    .item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .item-actions button {
      min-height: 30px;
      padding: 6px 8px;
      font-size: 12px;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
      text-align: center;
    }

    .status {
      margin-top: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      min-height: 34px;
    }

    .status.ok {
      color: #176c42;
      border-color: #b9e7ce;
      background: #eefaf3;
    }

    .status.bad {
      color: #9b2f2f;
      border-color: #f0c2c2;
      background: #fff0f0;
    }

    .dialog-backdrop {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 14px;
      background: rgba(31, 35, 41, 0.18);
    }

    .dialog {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 12px 32px rgba(31, 35, 41, 0.16);
      padding: 14px;
    }

    .dialog h2 {
      margin: 0 0 8px;
      font-size: 16px;
      line-height: 1.35;
      color: var(--text);
    }

    .dialog p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .dialog-options {
      display: grid;
      gap: 8px;
      margin: 10px 0;
    }

    .dialog-option {
      width: 100%;
      min-height: 38px;
      background: #f5f6f7;
      color: var(--text);
      text-align: left;
      font-weight: 600;
    }

    .dialog-option:hover { background: #eef3ff; }

    .dialog input {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .dialog input:focus {
      border-color: rgba(51, 112, 255, 0.65);
      box-shadow: 0 0 0 2px rgba(51, 112, 255, 0.10);
    }

    .schedule-form {
      display: grid;
      gap: 10px;
      margin: 6px 0 10px;
    }

    .schedule-row {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 88px;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      border: 1px solid #dfe5ff;
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      box-shadow: 0 2px 8px rgba(31, 35, 41, 0.04);
    }

    .schedule-icon {
      color: var(--primary-dark);
      font-size: 17px;
      line-height: 1;
      opacity: 0.72;
    }

    .schedule-date,
    .schedule-time,
    .schedule-select-row select {
      width: 100%;
      min-height: 32px;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 6px 8px;
      background: var(--primary-soft);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .schedule-date:focus,
    .schedule-time:focus,
    .schedule-select-row select:focus {
      border-color: rgba(31, 95, 215, 0.35);
      background: #fff;
      box-shadow: 0 0 0 2px rgba(31, 95, 215, 0.10);
    }

    .schedule-time,
    .schedule-select-row select {
      text-align: center;
    }

    .schedule-select-row {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-height: 44px;
      border: 1px solid #dfe5ff;
      border-radius: 8px;
      padding: 8px 10px;
      background: #fff;
      color: var(--muted);
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(31, 35, 41, 0.04);
    }



    .dialog-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>中断快记</h1>
    <button class="icon-btn" id="settingsBtn" type="button" title="提醒设置" aria-label="提醒设置">⚙</button>
  </div>
  <section class="settings" id="settingsPanel">
    <div class="settings-row">
      <label for="defaultMinutes">默认提醒时间（分钟）</label>
      <input id="defaultMinutes" type="number" min="1" max="1440" step="1">
      <button class="secondary" id="saveSettingsBtn" type="button">保存</button>
    </div>
    <div class="settings-actions">
      <button class="secondary" id="exportAllBtn" type="button">导出全部数据</button>
      <button class="danger" id="cleanupCompletedBtn" type="button">清理已完成</button>
    </div>
    <div class="settings-actions single">
      <button class="secondary" id="feedbackBtn" type="button">提交反馈</button>
    </div>
  </section>
  <div class="source" id="sourceText">正在读取当前页...</div>
  <form id="captureForm">
    <textarea id="quickText" placeholder="一句话写到哪了，回来先做什么" autofocus required></textarea>
    <div class="actions">
      <button class="primary" id="primarySubmitBtn" type="submit">记一下，15 分钟后提醒</button>
      <button class="secondary" id="voiceBtn" type="button">语音说</button>
      <button class="secondary" id="copyOpenBtn" type="button">复制未完成</button>
      <button class="secondary" id="testBtn" type="button">测试提醒</button>
    </div>
    <div class="status" id="statusText">先点“测试提醒”，这里会显示检测结果。</div>
  </form>
  <section class="list" id="itemList"></section>
  <script src="popup.js"></script>
</body>
</html>
